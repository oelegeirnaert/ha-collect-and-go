configuration:
  language:
    name: Producttaal
    description: Taal voor productnamen, zoekresultaten en winkelmandgegevens.
  session_cookies:
    name: Collect&Go-sessiecookies (optioneel)
    description: >-
      De sessiecookies van collectandgo.be — minimaal de
      WC_AUTHENTICATION_<userId>-cookie (naam=waarde). Normaal koppel je via
      het add-onpaneel (dat de sessie meteen tegen je echte winkelmand
      controleert); vul dit alleen in als je de configuratie liever hier
      beheert. Een sessie die via het paneel is opgeslagen heeft voorrang.
