configuration:
  language:
    name: Product language
    description: Language used for product names, search results and cart data.
  session_cookies:
    name: Collect&Go session cookies (optional)
    description: >-
      The session cookies from collectandgo.be — at minimum the
      WC_AUTHENTICATION_<userId> cookie (name=value). Normally you connect
      via the add-on panel instead (it validates the session against your
      live cart before saving); only fill this in if you prefer
      configuration-as-code. A session saved in the panel takes precedence.
