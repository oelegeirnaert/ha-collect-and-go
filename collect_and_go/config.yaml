name: Collect & Go — Shared Cart
version: "2.3.0"
slug: collect_and_go
description: >-
  Shop Collect&Go together from the Home Assistant sidebar. Search the
  assortment, add products to your shared cart ("winkelmand") with the
  right quantities, and check out in the official app.
url: https://github.com/oelegeirnaert/ha-collect-and-go
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cart-outline
panel_title: Collect & Go
ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Optional direct access to the web UI and REST API (e.g. for
    rest_command automations). Leave disabled to use ingress only.
options:
  language: nl
  session_cookies: ""
schema:
  language: list(nl|fr)
  session_cookies: password
