<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collect &amp; Go — shared cart</title>
<style>
  /* Collect&Go brand palette (from the site's styling guides):
     primary red, dark-blue secondary, orange action, teal info accents. */
  :root {
    --cg-red: #e30613;
    --cg-blue: #1c3661;
    --cg-blue-soft: #607290;
    --cg-orange: #ff6801;
    --cg-teal: #007368;
    --bg: #f3f4f7;
    --card: #ffffff;
    --text: #1b1f2a;
    --muted: #6b7280;
    --line: #dbe2ec;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #dc2626;
    --accent: var(--cg-red);
    --shadow: 0 1px 3px rgba(28, 54, 97, .10);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1c2230;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #2c3444;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px;
    background: var(--cg-blue); color: #fff;
    box-shadow: var(--shadow);
  }
  header .logo {
    font-size: 20px; background: #fff; border-radius: 50%;
    width: 34px; height: 34px; display: inline-flex;
    align-items: center; justify-content: center;
  }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 0 0 auto; letter-spacing: .2px; }
  header .spacer { flex: 1 1 auto; }
  header select, header button, header a.cart-link {
    background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35);
    border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  }
  header select option { color: #111; }
  header button:hover, header a.cart-link:hover { background: rgba(255,255,255,.26); }
  .status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; }
  .dot.ok { background: #4ade80; } .dot.err { background: #fbbf24; } .dot.off { background: #d1d5db; }

  main { max-width: 1080px; margin: 0 auto; padding: 18px 16px; }
  section.card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; margin-bottom: 18px;
  }
  section.card h2 { margin: 0 0 8px; font-size: 18px; color: var(--cg-blue); }
  @media (prefers-color-scheme: dark) { section.card h2 { color: #9fc0e8; } }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  textarea {
    width: 100%; min-height: 56px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, monospace;
  }
  input[type="search"] {
    width: 100%; border: 2px solid var(--cg-blue); border-radius: 999px;
    padding: 12px 20px; font-size: 15px; background: var(--card); color: var(--text);
  }
  input[type="search"]:focus { outline: 3px solid rgba(28,54,97,.25); border-color: var(--cg-blue); }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 999px;
    padding: 11px 22px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  button.primary:disabled { opacity: .6; cursor: default; }
  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; cursor: pointer;
  }
  button.ghost:hover { background: var(--bg); border-color: var(--cg-blue-soft); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .product {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow);
    transition: box-shadow .15s ease, transform .15s ease;
  }
  .product:hover { box-shadow: 0 4px 14px rgba(28, 54, 97, .16); transform: translateY(-1px); }
  .product img { width: 100%; height: 110px; object-fit: contain; background: #fff; border-radius: 10px; }
  .product .name { font-size: 13px; font-weight: 600; min-height: 34px; }
  .product .meta { font-size: 12px; color: var(--muted); }
  .product .price { font-size: 15px; font-weight: 700; color: var(--cg-blue); }
  @media (prefers-color-scheme: dark) { .product .price { color: #9fc0e8; } }
  .qty { display: flex; align-items: center; gap: 6px; }
  .qty button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-weight: 700; cursor: pointer;
  }
  .qty button:hover:not(:disabled) { border-color: var(--cg-blue); color: var(--cg-blue); }
  .qty button:disabled { opacity: .4; cursor: default; }
  .qty span { min-width: 22px; text-align: center; font-weight: 600; }
  .product button.add {
    background: var(--accent); color: #fff; flex: 1 1 auto;
    border: none; border-radius: 999px;
    padding: 8px 10px; font-weight: 700; cursor: pointer; font-size: 13px;
  }
  .product button.add:hover:not(:disabled) { background: #c00511; }
  .product button.add:disabled { opacity: .5; }
  select.list-pick {
    width: 100%; border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 12px; background: var(--bg); color: var(--text); font-size: 13px;
  }

  ul#cart-items { list-style: none; margin: 0; padding: 0; }
  ul#cart-items li {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 4px; border-bottom: 1px solid var(--line);
  }
  ul#cart-items li:last-child { border-bottom: none; }
  ul#cart-items li img {
    width: 54px; height: 54px; object-fit: contain; flex: 0 0 auto;
    background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px;
  }
  ul#cart-items .desc { flex: 1 1 auto; min-width: 0; }
  ul#cart-items .desc .nm { font-weight: 600; font-size: 14px; line-height: 1.3; }
  ul#cart-items .desc .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  ul#cart-items .price { font-weight: 700; white-space: nowrap; color: var(--cg-blue); font-size: 15px; }
  ul#cart-items .price .per { display: block; font-size: 11px; font-weight: 400; color: var(--muted); text-align: right; }
  @media (prefers-color-scheme: dark) { ul#cart-items .price { color: #9fc0e8; } }
  ul#cart-items button.del {
    border: none; background: transparent; cursor: pointer; font-size: 16px;
    color: var(--muted); padding: 4px 6px; border-radius: 50%;
  }
  ul#cart-items button.del:hover { color: var(--err); background: var(--bg); }

  .banner {
    border-radius: 12px; padding: 11px 15px; margin-bottom: 14px; font-size: 13px;
    border: 1px solid;
  }
  .banner.warn { background: #fff4e6; color: #b35300; border-color: #ffc38a; }
  @media (prefers-color-scheme: dark) { .banner.warn { background: #3a2a17; color: #fdba74; } }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--cg-blue); color: #fff; padding: 11px 20px; border-radius: 999px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .2s;
    max-width: 90vw; z-index: 50;
  }
  #toast.show { opacity: .97; }
  .hidden { display: none !important; }
  .section-title { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px; }
  .section-title h2 { margin: 0; font-size: 17px; flex: 1 1 auto; }
  .count-badge {
    background: var(--cg-orange); color: #fff; border-radius: 999px;
    font-size: 12px; font-weight: 700; padding: 2px 10px;
  }
  ol.steps { padding-left: 20px; } ol.steps li { margin-bottom: 7px; }
  code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
</style>
</head>
<body>
<header>
  <span class="logo">🛒</span>
  <h1>Collect &amp; Go</h1>
  <span class="status"><span id="status-dot" class="dot off"></span><span id="status-text">…</span></span>
  <span class="spacer"></span>
  <select id="ui-lang" title="Language">
    <option value="en">EN</option>
    <option value="nl">NL</option>
    <option value="fr">FR</option>
  </select>
  <a id="cart-link" class="cart-link hidden" href="#" target="_blank" rel="noopener noreferrer">🧺 <span data-i18n="open_cart">Checkout</span></a>
  <button id="disconnect-btn" class="hidden" data-i18n-title="disconnect" title="Disconnect">⏻</button>
</header>

<main>
  <div id="expired-banner" class="banner warn hidden" data-i18n="expired_banner"></div>

  <!-- session setup -->
  <section id="setup-card" class="card hidden">
    <h2 data-i18n="connect_title">Connect Collect&amp;Go</h2>
    <p class="muted" data-i18n="connect_intro"></p>
    <ol class="steps">
      <li data-i18n-html="step1"></li>
      <li data-i18n-html="step2"></li>
      <li data-i18n-html="step3"></li>
      <li data-i18n-html="step4"></li>
    </ol>
    <textarea id="token-input" placeholder='Paste the cURL command here (DevTools → Network → right-click a request → Copy as cURL) — or just WC_AUTHENTICATION_1234567=…'></textarea>
    <div class="row" style="margin-top:10px">
      <button id="save-session" class="primary" data-i18n="save">Save &amp; connect</button>
      <span id="save-status" class="muted"></span>
    </div>
  </section>

  <!-- main view -->
  <section id="main-view" class="hidden">
    <div class="card">
      <input id="search" type="search" data-i18n-ph="search_placeholder" autocomplete="off">
      <div class="row" id="target-row" style="margin-top:8px; display:none">
        <label class="muted" data-i18n="target_label" style="white-space:nowrap">Add to:</label>
        <select id="list-pick" class="list-pick" style="flex:1; min-width:140px"></select>
      </div>
    </div>

    <div id="results-wrap" class="hidden">
      <div class="section-title"><h2 data-i18n="results">Results</h2><span id="results-count" class="muted"></span></div>
      <div id="results" class="grid"></div>
    </div>

    <div class="card">
      <div class="section-title">
        <h2 data-i18n="cart_title">Winkelmand</h2>
        <span id="cart-count" class="count-badge">0</span>
        <button id="refresh" class="ghost" data-i18n="refresh">Refresh</button>
      </div>
      <ul id="cart-items"></ul>
      <p id="cart-empty" class="muted hidden" data-i18n="cart_empty"></p>
      <p id="cart-total" class="muted hidden" style="font-weight:600; font-size:15px"></p>
      <p id="cart-updated" class="muted" style="font-size:11px; margin:8px 0 0"></p>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
"use strict";
/* ---------------------------------------------------------------- i18n -- */
const I18N = {

    connect_intro: "De add-on praat met Collect&Go via je eigen sessietoken. Je wachtwoord wordt nooit bewaard — enkel het token, veilig binnen Home Assistant.",
    step1: 'Open <a href="https://www.collectandgo.be" target="_blank" rel="noopener">collectandgo.be</a> in een nieuw tabblad, meld aan met je Xtra-account (sms-code zoals gewoonlijk) en kies je winkel.',
    step2: "Open op collectandgo.be de ontwikkelaarstools (<b>F12</b>) → tabblad <b>Application</b> (Chrome) of <b>Opslag</b> (Firefox) → <b>Cookies</b> → <code>https://www.collectandgo.be</code>.",

    checking: "controleren…", connected: "gekoppeld", not_connected: "niet gekoppeld", expired: "sessie verlopen",

    cart_title: "Winkelmand", refresh: "Vernieuw",

    added_to_list: "op het lijstje gezet ✓",

    session_rejected: "Collect&Go aanvaardde die sessie niet. Ben je aangemeld op collectandgo.be en heb je de volledige WC_AUTHENTICATION-cookie gekopieerd?",
  },
  fr: {
    connect_title: "Connecter Collect&Go",
    connect_intro: "L'add-on communique avec Collect&Go via votre propre jeton de session. Votre mot de passe n'est jamais enregistré — uniquement le jeton, conservé dans Home Assistant.",
    step1: 'Ouvrez <a href="https://www.collectandgo.be" target="_blank" rel="noopener">collectandgo.be</a> dans un nouvel onglet, connectez-vous avec votre compte Xtra (code SMS comme d’habitude) et choisissez votre magasin.',
    step2: "Sur collectandgo.be, ouvrez les outils développeur (<b>F12</b>) → onglet <b>Application</b> (Chrome) ou <b>Stockage</b> (Firefox) → <b>Cookies</b> → <code>https://www.collectandgo.be</code>.",
    step3: "Le plus simple : dans l'onglet <b>Réseau</b>, cliquez sur n'importe quelle requête vers <code>collectandgo.be</code>, clic droit → <b>Copier → Copier en cURL</b>, puis collez le tout ci-dessous. Ou utilisez <b>Application → Cookies</b> et copiez le <b>nom et la valeur</b> du cookie <code>WC_AUTHENTICATION_…</code>.",

    results: "Résultats", items: "articles",
    cart_title: "Chariot", refresh: "Rafraîchir",

    open_cart: "Payer",
    add_cart: "Ajouter au chariot", add_list: "Vers la liste", added: "ajouté ✓",
    added_to_cart: "ajouté au chariot ✓",
    added_to_list: "ajouté à la liste ✓",
    target_label: "Ajouter les produits à :", default_target: "🛒 Chariot",
    rate_limited: "Collect&Go nous limite — patientez quelques secondes et réessayez.",
    auth_lost: "Session expirée — reconnectez-vous.",
    error_generic: "Quelque chose a raté",
    remove_title: "Retirer du chariot",
    updated_at: "Mis à jour",
    session_saved: "Connecté — bonnes courses !",
    session_rejected: "Collect&Go a refusé cette session. Connecté sur collectandgo.be et cookie WC_AUTHENTICATION complet copié ?",
  },

let uiLang = localStorage.getItem("cg-ui-lang") || "en";
let state = null;
let refreshTimer = null;
let namedLists = [];     // [{id, name}] — empty = only the cart
let activeListId = "";  // "" = the cart itself

const $ = (s) => document.querySelector(s);

function t(k) { return (I18N[uiLang] && I18N[uiLang][k]) || I18N.en[k] || k; }

function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-title]").forEach((el) => { el.title = t(el.dataset.i18nTitle); });
  relabelAddButtons();
}

function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 3500);
}

/* ----------------------------------------------------------------- api -- */
async function api(path, opts = {}) {
  const res = await fetch("api/" + path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 401) { const e = new Error("auth"); e.code = "auth"; throw e; }
  if (res.status === 429) { const e = new Error("rate"); e.code = "rate"; throw e; }
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (_) {}
    const e = new Error(msg); e.code = "http"; throw e;
  }
  return res.json();
}

function handleError(e) {
  if (e.code === "auth") { setStatus("err", t("expired")); showSetup(true); toast(t("auth_lost")); }
  else if (e.code === "rate") { toast(t("rate_limited")); }
  else { toast(t("error_generic") + (e.message ? ": " + e.message : "")); }
}

/* --------------------------------------------------------------- render -- */
function setStatus(kind, text) {
  $("#status-dot").className = "dot " + (kind || "off");
  $("#status-text").textContent = text;
}

function showSetup(expired) {
  $("#setup-card").classList.remove("hidden");
  $("#main-view").classList.add("hidden");
  $("#expired-banner").classList.toggle("hidden", !expired);
  $("#disconnect-btn").classList.add("hidden");
  $("#cart-link").classList.add("hidden");
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

function showMain() {
  $("#setup-card").classList.add("hidden");
  $("#main-view").classList.remove("hidden");
  $("#expired-banner").classList.add("hidden");
  $("#disconnect-btn").classList.remove("hidden");
  $("#cart-link").classList.remove("hidden");
  if (state && state.cart_url) $("#cart-link").href = state.cart_url;
  if (!refreshTimer) {
    refreshTimer = setInterval(() => { if (document.visibilityState === "visible") loadCart(true); }, 20000);
  }
}

function fmtPrice(v) {
  if (v === null || v === undefined) return "";
  return "€ " + Number(v).toFixed(2).replace(".", ",");
}

function addLabel() {
  return (activeListId ? "📋 " + t("add_list") : "🛒 " + t("add_cart"));
}

function relabelAddButtons() {
  document.querySelectorAll("#results .product button.add").forEach((b) => {
    if (!b.disabled) b.textContent = addLabel();
  });
}

function productCard(p) {
  const card = document.createElement("div");
  card.className = "product";
  const img = document.createElement("img");
  img.loading = "lazy"; img.src = p.image || ""; img.alt = "";
  img.onerror = () => { img.style.display = "none"; };
  card.appendChild(img);

  const name = document.createElement("div");
  name.className = "name"; name.textContent = p.name;
  card.appendChild(name);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = [p.brand, p.content].filter(Boolean).join(" · ");
  card.appendChild(meta);

  const price = document.createElement("div");
  price.className = "price"; price.textContent = fmtPrice(p.price);
  card.appendChild(price);

  const row = document.createElement("div");
  row.className = "row";
  row.style.justifyContent = "space-between";

  const qty = document.createElement("div");
  qty.className = "qty";
  const minus = document.createElement("button"); minus.textContent = "−";
  const val = document.createElement("span"); val.textContent = "1";
  const plus = document.createElement("button"); plus.textContent = "+";
  minus.onclick = () => { val.textContent = Math.max(1, parseInt(val.textContent, 10) - 1); };
  plus.onclick = () => { val.textContent = Math.min(99, parseInt(val.textContent, 10) + 1); };
  qty.append(minus, val, plus);
  row.appendChild(qty);
  card.appendChild(row);

  const qtyVal = () => parseInt(val.textContent, 10);

  const add = document.createElement("button");
  add.className = "add"; add.textContent = addLabel();
  add.onclick = async () => {
    add.disabled = true;
    try {
      if (activeListId) {
        await api("lists/items", {
          method: "POST",
          body: JSON.stringify({ list_id: activeListId, product_ids: [p.part_number || p.product_id] }),
        });
        toast(t("added_to_list"));
      } else {
        await api("cart/items", {
          method: "POST",
          body: JSON.stringify({ product_id: p.product_id, entry_id: p.entry_id, quantity: qtyVal() }),
        });
        toast(t("added_to_cart"));
        loadCart(true);
      }
      add.textContent = "✓ " + t("added");
      setTimeout(() => { add.textContent = addLabel(); add.disabled = false; }, 1200);
    } catch (e) { add.textContent = addLabel(); add.disabled = false; handleError(e); }
  };
  card.appendChild(add);
  return card;
}

function renderProducts(products) {
  const el = $("#results");
  el.innerHTML = "";
  products.forEach((p) => el.appendChild(productCard(p)));
  $("#results-wrap").classList.toggle("hidden", products.length === 0);
}

function renderCart(cart) {
  const items = cart.items || [];
  const ul = $("#cart-items");
  ul.innerHTML = "";
  items.forEach((it) => {
    const li = document.createElement("li");

    const img = document.createElement("img");
    img.loading = "lazy"; img.src = it.image || ""; img.alt = "";
    img.onerror = () => { img.style.visibility = "hidden"; };
    if (!it.image) img.style.visibility = "hidden";
    li.appendChild(img);

    const desc = document.createElement("div");
    desc.className = "desc";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = it.description || it.product_id || "?";
    desc.appendChild(nm);
    if (it.brand || it.content) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = [it.brand, it.content].filter(Boolean).join(" · ");
      desc.appendChild(sub);
    }
    li.appendChild(desc);

    const qty = document.createElement("div");
    qty.className = "qty";
    const minus = document.createElement("button"); minus.textContent = "−";
    const val = document.createElement("span"); val.textContent = it.quantity || 1;
    const plus = document.createElement("button"); plus.textContent = "+";
    minus.disabled = (it.quantity || 1) <= 1;
    minus.onclick = () => updateCartItem(it.id, (it.quantity || 1) - 1, minus, it);
    plus.onclick = () => updateCartItem(it.id, (it.quantity || 1) + 1, plus, it);
    qty.append(minus, val, plus);
    li.appendChild(qty);

    if (it.price !== null && it.price !== undefined) {
      const pr = document.createElement("div");
      pr.className = "price";
      pr.textContent = fmtPrice(it.price);
      if (it.quantity > 1 && it.unit_price) {
        const per = document.createElement("span");
        per.className = "per";
        per.textContent = fmtPrice(it.unit_price) + " /st";
        pr.appendChild(per);
      }
      li.appendChild(pr);
    }

    const del = document.createElement("button");
    del.className = "del"; del.title = t("remove_title"); del.textContent = "🗑";
    del.onclick = async () => {
      del.disabled = true;
      try {
        await api("cart/items/" + encodeURIComponent(it.id), { method: "DELETE" });
        await loadCart(true);
      } catch (e) { del.disabled = false; handleError(e); }
    };
    li.appendChild(del);
    ul.appendChild(li);
  });

  $("#cart-count").textContent = items.length;
  $("#cart-empty").classList.toggle("hidden", items.length > 0);
  const totalEl = $("#cart-total");
  if (cart.total !== null && cart.total !== undefined) {
    totalEl.textContent = t("cart_total") + ": " + fmtPrice(cart.total);
    totalEl.classList.remove("hidden");
  } else {
    totalEl.classList.add("hidden");
  }
  $("#cart-updated").textContent = t("updated_at") + " " + new Date().toLocaleTimeString();
}

/* ----------------------------------------------------------------- flow -- */
async function loadCart(silent) {
  try {
    const data = await api("cart" + (silent ? "" : "?force=true"));
    renderCart(data);
  } catch (e) { if (!silent || e.code === "auth") handleError(e); }
}

async function updateCartItem(orderItemId, quantity, btn, item) {
  if (quantity < 1) return;
  btn.disabled = true;
  try {
    await api("cart/items/" + encodeURIComponent(orderItemId), {
      method: "PUT",
      body: JSON.stringify({ quantity, part_number: item && item.entry_id }),
    });
    await loadCart(true);
  } catch (e) { handleError(e); await loadCart(true); }
}

async function loadLists() {
  try {
    const data = await api("lists");
    namedLists = data.lists || [];
  } catch (e) {
    if (e.code === "auth") { handleError(e); return; }
    namedLists = [];
  }
  const sel = $("#list-pick");
  sel.innerHTML = "";
  const def = document.createElement("option");
  def.value = ""; def.textContent = t("default_target");
  sel.appendChild(def);
  namedLists.forEach((l) => {
    const o = document.createElement("option");
    o.value = l.id; o.textContent = "📋 " + l.name;
    sel.appendChild(o);
  });
  sel.value = activeListId;
  // Hide the picker entirely when there are no named lists.
  $("#target-row").style.display = namedLists.length ? "" : "none";
}

let searchTimer = null;
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = $("#search").value.trim();
  if (q.length < 2) {
    $("#results-wrap").classList.add("hidden");
    return;
  }
  searchTimer = setTimeout(async () => {
    try {
      const data = await api("search?q=" + encodeURIComponent(q));
      renderProducts(data.products || []);
      $("#results-count").textContent = data.total ? data.total + " " + t("items") : "";
    } catch (e) { handleError(e); }
  }, 350);
}

async function connect() {
  const btn = $("#save-session");
  btn.disabled = true;
  $("#save-status").textContent = t("checking");
  try {
    await api("session", { method: "POST", body: JSON.stringify({ cookies: $("#token-input").value }) });
    $("#token-input").value = "";
    $("#save-status").textContent = "";
    toast(t("session_saved"));
    await boot(true);
  } catch (e) {
    $("#save-status").textContent = e.code === "auth" ? t("session_rejected") : (e.message || t("error_generic"));
  } finally {
    btn.disabled = false;
  }
}

async function boot(skipState) {
  if (!skipState) {
    try { state = await api("state"); } catch (e) { state = null; }
    if (state && state.language && !localStorage.getItem("cg-ui-lang")) {
      uiLang = state.language === "fr" ? "fr" : (state.language === "nl" ? "nl" : "en");
      $("#ui-lang").value = uiLang;
      applyI18n();
    }
    if (state && state.cart_url) $("#cart-link").href = state.cart_url;
  }
  if (!state || !state.configured) {
    setStatus("off", t("not_connected"));
    showSetup(false);
    return;
  }
  setStatus("off", t("checking"));
  try {
    const check = await api("session/check");
    if (!check.valid) { setStatus("err", t("expired")); showSetup(true); return; }
  } catch (e) { handleError(e); return; }
  setStatus("ok", t("connected"));
  showMain();
  await loadCart(true);
  loadLists();
}

/* ----------------------------------------------------------------- init -- */
document.addEventListener("DOMContentLoaded", () => {
  $("#ui-lang").value = uiLang;
  $("#ui-lang").onchange = () => {
    uiLang = $("#ui-lang").value;
    localStorage.setItem("cg-ui-lang", uiLang);
    applyI18n();
  };
  $("#search").addEventListener("input", onSearchInput);
  $("#save-session").onclick = connect;
  $("#refresh").onclick = () => loadCart(false);
  $("#disconnect-btn").onclick = async () => {
    try { await api("session", { method: "DELETE" }); } catch (_) {}
    setStatus("off", t("not_connected"));
    showSetup(false);
  };
  $("#list-pick").onchange = () => {
    activeListId = $("#list-pick").value;
    relabelAddButtons();
  };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && !$("#main-view").classList.contains("hidden")) loadCart(true);
  });
  applyI18n();
  boot(false);
});
</script>
</body>
</html>
